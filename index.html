<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인생투컷</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #00b4d8;
    --accent2: #0077b6;
    --text: #e0e0e0;
    --text-dim: #8888aa;
    --success: #4caf50;
    --danger: #e63946;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header {
    text-align: center;
    padding: 24px 16px 16px;
  }
  header h1 {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), #a8dadc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  header p {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  /* Progress bar */
  .progress-wrap {
    display: flex;
    justify-content: center;
    gap: 0;
    padding: 0 16px 24px;
    max-width: 600px;
    margin: 0 auto;
  }
  .step-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .step-item:not(:last-child)::after {
    content: '';
    position: absolute;
    top: 15px;
    left: 50%;
    width: 100%;
    height: 2px;
    background: var(--surface2);
    transition: background 0.3s;
  }
  .step-item.done:not(:last-child)::after,
  .step-item.active:not(:last-child)::after {
    background: var(--accent);
  }
  .step-dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    position: relative;
    z-index: 1;
    transition: all 0.3s;
    color: var(--text-dim);
  }
  .step-item.done .step-dot {
    background: var(--accent);
    color: #fff;
  }
  .step-item.active .step-dot {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px var(--accent);
  }
  .step-label {
    font-size: 0.6rem;
    margin-top: 4px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .step-item.active .step-label { color: var(--accent); }

  /* Main content */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 24px;
    border: none;
    border-radius: var(--radius);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 4px 15px rgba(0,180,216,0.3);
  }
  .btn-primary:hover { box-shadow: 0 4px 20px rgba(0,180,216,0.5); }
  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
  }
  .btn-secondary:hover { background: #1a4a7a; }
  .btn-danger {
    background: var(--danger);
    color: #fff;
  }
  .btn-success {
    background: var(--success);
    color: #fff;
    box-shadow: 0 4px 15px rgba(76,175,80,0.3);
  }
  .btn-sm {
    padding: 6px 12px;
    font-size: 0.75rem;
    border-radius: 8px;
  }

  /* Error screen */
  .error-box {
    text-align: center;
    padding: 40px 20px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid #e63946;
  }
  .error-box .icon { font-size: 3rem; margin-bottom: 16px; }
  .error-box h2 { margin-bottom: 8px; }
  .error-box p { color: var(--text-dim); line-height: 1.6; }

  /* Camera screen */
  .camera-layout {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  @media (min-width: 700px) {
    .camera-layout { flex-direction: row; align-items: flex-start; }
    .camera-col { flex: 1; }
    .thumbs-col { width: 200px; flex-shrink: 0; }
  }

  .video-wrap {
    position: relative;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    aspect-ratio: 3/4;
    max-height: 60vh;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .video-wrap.mirrored video { transform: scaleX(-1); }

  .countdown-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 40px rgba(0,0,0,0.8);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .countdown-overlay.visible { opacity: 1; }

  .flash-overlay {
    position: absolute;
    inset: 0;
    background: #fff;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.05s;
  }
  .flash-overlay.flash { opacity: 1; }

  .shot-count {
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-dim);
    margin-top: 8px;
    min-height: 1.5em;
  }
  .shot-count strong { color: var(--accent); font-size: 1.1rem; }

  .camera-controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .camera-controls .btn { flex: 1; min-width: 100px; }

  /* Thumbnails */
  .thumbs-col h3 {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 10px;
    text-align: center;
  }
  .thumb-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  @media (min-width: 700px) {
    .thumb-list { grid-template-columns: 1fr; }
  }

  .thumb-item {
    background: var(--surface);
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.2s;
    position: relative;
  }
  .thumb-item.empty {
    aspect-ratio: 3/4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 0.75rem;
    gap: 6px;
    border: 2px dashed var(--surface2);
  }
  .thumb-item.empty .num {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--surface2);
  }
  .thumb-item img {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    display: block;
  }
  .thumb-retake {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .thumb-item:hover .thumb-retake { opacity: 1; }
  @media (pointer: coarse) {
    .thumb-retake { opacity: 1; }
  }

  /* Select screen */
  .select-instruction {
    text-align: center;
    padding: 12px 16px;
    background: var(--surface);
    border-radius: var(--radius);
    margin-bottom: 16px;
  }
  .select-instruction p { margin-bottom: 4px; }
  .select-count { color: var(--accent); font-weight: 700; font-size: 1.1rem; }

  .select-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (min-width: 600px) {
    .select-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .select-item {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .select-item img {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    display: block;
  }
  .select-item.selected {
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(0,180,216,0.4);
  }
  .select-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: 0.9rem;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .select-item.selected .select-badge { display: flex; }

  .select-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* Result screen */
  .result-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .result-preview {
    max-width: 300px;
    width: 100%;
  }
  .result-preview img {
    width: 100%;
    border-radius: var(--radius);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    display: block;
  }
  .result-info {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
  }
  .result-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* Hidden canvas */
  #compositeCanvas { display: none; }
</style>
</head>
<body>

<header>
  <h1>인생투컷</h1>
  <p>4장 연속 촬영됩니다. 맘에 드는 2장을 골라요❤️</p>
</header>

<!-- Progress -->
<div class="progress-wrap" id="progressBar">
  <div class="step-item active" data-step="1">
    <div class="step-dot">1</div>
    <span class="step-label">카메라</span>
  </div>
  <div class="step-item" data-step="2">
    <div class="step-dot">2</div>
    <span class="step-label">촬영</span>
  </div>
  <div class="step-item" data-step="3">
    <div class="step-dot">3</div>
    <span class="step-label">선택</span>
  </div>
  <div class="step-item" data-step="4">
    <div class="step-dot">4</div>
    <span class="step-label">합성</span>
  </div>
  <div class="step-item" data-step="5">
    <div class="step-dot">5</div>
    <span class="step-label">저장</span>
  </div>
</div>

<main>

  <!-- Error screen -->
  <div class="screen" id="screenError">
    <div class="error-box">
      <div class="icon">📵</div>
      <h2 id="errorTitle">오류 발생</h2>
      <p id="errorMsg"></p>
      <br>
      <button class="btn btn-secondary" onclick="initCamera()">다시 시도</button>
    </div>
  </div>

  <!-- Camera / Shoot screen (steps 1 & 2) -->
  <div class="screen active" id="screenCamera">
    <div class="camera-layout">
      <div class="camera-col">
        <div class="video-wrap" id="videoWrap">
          <video id="video" autoplay playsinline muted></video>
          <div class="countdown-overlay" id="countdownOverlay"></div>
          <div class="flash-overlay" id="flashOverlay"></div>
        </div>
        <div class="shot-count" id="shotCount">카메라를 준비 중입니다…</div>
        <div class="camera-controls">
          <button class="btn btn-primary" id="btnShoot" onclick="startCountdown()" disabled>📷 촬영</button>
          <button class="btn btn-secondary btn-sm" id="btnFlip" onclick="toggleMirror()" title="좌우 반전">🔁 반전</button>
          <button class="btn btn-secondary btn-sm" id="btnSwitch" onclick="switchCamera()" title="카메라 전환">🔄 전환</button>
        </div>
      </div>
      <div class="thumbs-col">
        <h3>촬영된 사진</h3>
        <div class="thumb-list" id="thumbList">
          <!-- 4 slots rendered by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Select screen (step 3) -->
  <div class="screen" id="screenSelect">
    <div class="select-instruction">
      <p>원하는 사진 2장을 선택하세요</p>
      <div class="select-count" id="selectCountText">선택됨: 0 / 2</div>
    </div>
    <div class="select-grid" id="selectGrid"></div>
    <div class="select-actions">
      <button class="btn btn-secondary" onclick="goBackToCamera()">↩ 다시 촬영</button>
      <button class="btn btn-primary" id="btnCompose" onclick="composeImage()" disabled>✅ 두 장 고르기</button>
    </div>
  </div>

  <!-- Result screen (steps 4 & 5) -->
  <div class="screen" id="screenResult">
    <div class="result-wrap">
      <div class="result-preview">
        <img id="resultImg" src="" alt="합성 결과">
      </div>
      <div class="result-info">
        630 × 1020 px &nbsp;|&nbsp; 2.1 × 3.4인치 &nbsp;|&nbsp; 300 DPI
      </div>
      <div class="result-actions">
        <button class="btn btn-success" onclick="download('png')">💾 PNG 저장</button>
        <button class="btn btn-success" onclick="download('jpg')">💾 JPG 저장</button>
        <button class="btn btn-secondary" onclick="resetAll()">🔄 새로 촬영하기</button>
      </div>
    </div>
  </div>

</main>

<canvas id="compositeCanvas" width="630" height="1020"></canvas>

<script>
// ─── State ───────────────────────────────────────────────
const MAX_SHOTS = 4;
const CANVAS_W = 630;
const CANVAS_H = 1020;
const HALF_H = CANVAS_H / 2; // 510

let stream = null;
let currentFacingMode = 'user';
let mirrored = true; // selfie mode on by default
let photos = Array(MAX_SHOTS).fill(null); // DataURLs
let retakeIndex = -1; // which slot is being retaken
let selectedIndices = []; // up to 2
let isCountingDown = false;

const video = document.getElementById('video');
const videoWrap = document.getElementById('videoWrap');
const countdownOverlay = document.getElementById('countdownOverlay');
const flashOverlay = document.getElementById('flashOverlay');
const btnShoot = document.getElementById('btnShoot');
const thumbList = document.getElementById('thumbList');
const shotCountEl = document.getElementById('shotCount');
const canvas = document.getElementById('compositeCanvas');
const ctx = canvas.getContext('2d');

// ─── Init ─────────────────────────────────────────────────
renderThumbSlots();
initCamera();

async function initCamera() {
  showScreen('screenCamera');
  setStep(1);
  btnShoot.disabled = true;
  shotCountEl.textContent = '카메라를 준비 중입니다…';

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  const constraints = {
    video: {
      facingMode: { ideal: currentFacingMode },
      width: { ideal: 1280 },
      height: { ideal: 960 }
    },
    audio: false
  };

  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (e) {
    if (currentFacingMode === 'user') {
      try {
        currentFacingMode = 'environment';
        constraints.video.facingMode = { ideal: 'environment' };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch (e2) {
        showError(e2);
        return;
      }
    } else {
      showError(e);
      return;
    }
  }

  video.srcObject = stream;
  await video.play();
  updateMirror();
  btnShoot.disabled = false;
  updateShotCount();
  setStep(2);
}

function showError(err) {
  let title = '카메라 오류';
  let msg = '';
  if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
    title = '카메라 권한 필요';
    msg = '카메라 접근 권한이 필요합니다. 브라우저 주소창 옆 잠금 아이콘을 눌러 카메라 권한을 허용해 주세요.';
  } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
    title = '카메라를 찾을 수 없습니다';
    msg = '연결된 카메라 장치가 없습니다. 카메라를 연결하거나 다른 기기에서 사용해 보세요.';
  } else {
    msg = `오류: ${err.message || err.name}`;
  }
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorMsg').textContent = msg;
  showScreen('screenError');
}

// ─── Mirror / Switch ──────────────────────────────────────
function toggleMirror() {
  mirrored = !mirrored;
  updateMirror();
}

function updateMirror() {
  videoWrap.classList.toggle('mirrored', mirrored);
}

async function switchCamera() {
  currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
  mirrored = currentFacingMode === 'user';
  await initCamera();
}

// ─── Countdown & Shoot ───────────────────────────────────
function startCountdown() {
  if (isCountingDown) return;

  const isRetake = retakeIndex >= 0;
  const targetSlot = isRetake ? retakeIndex : photos.indexOf(null);
  if (targetSlot === -1) return;

  runCountdown(targetSlot, !isRetake);
}

function runCountdown(targetSlot, autoContinue) {
  isCountingDown = true;
  btnShoot.disabled = true;

  let count = 3;
  countdownOverlay.textContent = count;
  countdownOverlay.classList.add('visible');

  const tick = setInterval(() => {
    count--;
    if (count <= 0) {
      clearInterval(tick);
      countdownOverlay.textContent = '📷';
      setTimeout(() => {
        countdownOverlay.classList.remove('visible');
        capturePhoto(targetSlot, autoContinue);
      }, 400);
    } else {
      countdownOverlay.textContent = count;
    }
  }, 1000);
}

function capturePhoto(slotIndex, autoContinue) {
  // Flash
  flashOverlay.classList.add('flash');
  setTimeout(() => flashOverlay.classList.remove('flash'), 150);

  // Draw current video frame to a temp canvas
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = video.videoWidth || 640;
  tempCanvas.height = video.videoHeight || 480;
  const tCtx = tempCanvas.getContext('2d');

  if (mirrored) {
    tCtx.translate(tempCanvas.width, 0);
    tCtx.scale(-1, 1);
  }
  tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

  photos[slotIndex] = tempCanvas.toDataURL('image/jpeg', 0.92);
  retakeIndex = -1;
  isCountingDown = false;
  renderThumbSlots();
  updateShotCount();

  const filled = photos.filter(Boolean).length;

  if (filled === MAX_SHOTS) {
    setTimeout(goToSelect, 800);
  } else if (autoContinue) {
    // 다음 슬롯을 3초 카운트다운으로 자동 촬영
    setTimeout(() => {
      const nextSlot = photos.indexOf(null);
      if (nextSlot !== -1) runCountdown(nextSlot, true);
    }, 600);
  } else {
    btnShoot.disabled = false;
  }
}

function updateShotCount() {
  const filled = photos.filter(Boolean).length;
  if (filled === 0) {
    shotCountEl.innerHTML = '첫 번째 사진을 촬영하세요';
  } else if (filled < MAX_SHOTS) {
    shotCountEl.innerHTML = `<strong>${filled}</strong> / ${MAX_SHOTS} 촬영 완료`;
  } else {
    shotCountEl.innerHTML = `<strong>${MAX_SHOTS}</strong> / ${MAX_SHOTS} 촬영 완료 ✅`;
  }
}

// ─── Thumbnail slots ──────────────────────────────────────
function renderThumbSlots() {
  thumbList.innerHTML = '';
  for (let i = 0; i < MAX_SHOTS; i++) {
    const item = document.createElement('div');
    item.className = 'thumb-item' + (photos[i] ? '' : ' empty');

    if (photos[i]) {
      const img = document.createElement('img');
      img.src = photos[i];
      img.alt = `사진 ${i + 1}`;
      item.appendChild(img);

      const btn = document.createElement('button');
      btn.className = 'btn btn-danger btn-sm thumb-retake';
      btn.textContent = '🔄 다시 찍기';
      btn.onclick = () => triggerRetake(i);
      item.appendChild(btn);
    } else {
      item.innerHTML = `<span class="num">${i + 1}</span><span>대기 중</span>`;
    }

    thumbList.appendChild(item);
  }
}

function triggerRetake(index) {
  retakeIndex = index;
  photos[index] = null;
  renderThumbSlots();
  updateShotCount();
  // Highlight which slot
  shotCountEl.innerHTML = `<strong>${index + 1}번</strong> 사진을 다시 촬영하세요`;
}

// ─── Navigation ───────────────────────────────────────────
function goToSelect() {
  showScreen('screenSelect');
  setStep(3);
  selectedIndices = [];
  buildSelectGrid();
  updateSelectUI();
}

function goBackToCamera() {
  showScreen('screenCamera');
  setStep(2);
  renderThumbSlots();
  updateShotCount();
}

function buildSelectGrid() {
  const grid = document.getElementById('selectGrid');
  grid.innerHTML = '';
  photos.forEach((dataUrl, i) => {
    const item = document.createElement('div');
    item.className = 'select-item';
    item.dataset.index = i;

    const img = document.createElement('img');
    img.src = dataUrl;
    img.alt = `사진 ${i + 1}`;
    item.appendChild(img);

    const badge = document.createElement('div');
    badge.className = 'select-badge';
    item.appendChild(badge);

    item.onclick = () => toggleSelect(i);
    grid.appendChild(item);
  });
}

function toggleSelect(index) {
  const pos = selectedIndices.indexOf(index);
  if (pos !== -1) {
    selectedIndices.splice(pos, 1);
  } else {
    if (selectedIndices.length >= 2) return;
    selectedIndices.push(index);
  }
  updateSelectUI();
}

function updateSelectUI() {
  const items = document.querySelectorAll('.select-item');
  items.forEach((item, i) => {
    const selPos = selectedIndices.indexOf(i);
    const badge = item.querySelector('.select-badge');
    if (selPos !== -1) {
      item.classList.add('selected');
      badge.textContent = selPos === 0 ? '①' : '②';
    } else {
      item.classList.remove('selected');
      badge.textContent = '';
    }
  });

  const count = selectedIndices.length;
  document.getElementById('selectCountText').textContent = `선택됨: ${count} / 2`;
  document.getElementById('btnCompose').disabled = count !== 2;
}

// ─── Compose ─────────────────────────────────────────────
function composeImage() {
  if (selectedIndices.length !== 2) return;
  setStep(4);

  const [idx1, idx2] = selectedIndices;

  const img1 = new Image();
  const img2 = new Image();
  let loaded = 0;

  function onLoad() {
    loaded++;
    if (loaded < 2) return;

    // White background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // Draw top photo
    drawCover(ctx, img1, 0, 0, CANVAS_W, HALF_H);

    // 1px white separator (already white background, draw a subtle line)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, HALF_H - 1, CANVAS_W, 2);

    // Draw bottom photo
    drawCover(ctx, img2, 0, HALF_H, CANVAS_W, HALF_H);

    // Show result
    const dataUrl = canvas.toDataURL('image/png');
    document.getElementById('resultImg').src = dataUrl;
    showScreen('screenResult');
    setStep(5);
  }

  img1.onload = onLoad;
  img2.onload = onLoad;
  img1.src = photos[idx1];
  img2.src = photos[idx2];
}

// object-fit: cover approach
function drawCover(ctx, img, x, y, w, h) {
  const imgAspect = img.naturalWidth / img.naturalHeight;
  const boxAspect = w / h;

  let srcX, srcY, srcW, srcH;

  if (imgAspect > boxAspect) {
    // image wider than box — crop sides
    srcH = img.naturalHeight;
    srcW = srcH * boxAspect;
    srcX = (img.naturalWidth - srcW) / 2;
    srcY = 0;
  } else {
    // image taller than box — crop top/bottom
    srcW = img.naturalWidth;
    srcH = srcW / boxAspect;
    srcX = 0;
    srcY = (img.naturalHeight - srcH) / 2;
  }

  ctx.drawImage(img, srcX, srcY, srcW, srcH, x, y, w, h);
}

// ─── Download ─────────────────────────────────────────────
function download(format) {
  const dataUrl = format === 'png'
    ? canvas.toDataURL('image/png')
    : canvas.toDataURL('image/jpeg', 0.95);
  const filename = format === 'png' ? 'photo_id.png' : 'photo_id.jpg';

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  if (isIOS) {
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html>
<html lang="ko">

<meta charset="UTF-8">

// ─── Reset ────────────────────────────────────────────────
function resetAll() {
  photos = Array(MAX_SHOTS).fill(null);
  selectedIndices = [];
  retakeIndex = -1;
  isCountingDown = false;
  btnShoot.disabled = false;
  renderThumbSlots();
  updateShotCount();
  showScreen('screenCamera');
  setStep(2);
}

// ─── Helpers ──────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setStep(n) {
  document.querySelectorAll('#progressBar .step-item').forEach(el => {
    const s = parseInt(el.dataset.step);
    el.classList.remove('active', 'done');
    if (s < n) el.classList.add('done');
    else if (s === n) el.classList.add('active');
  });
}
</script>
