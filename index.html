<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인생투컷</title>
<link id="appleIcon" rel="apple-touch-icon" sizes="180x180" href="">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2컷">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gaegu&family=Noto+Sans+KR:wght@700&family=Pacifico&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;
  --accent:#00b4d8;--accent2:#0077b6;
  --text:#e0e0e0;--text-dim:#8888aa;
  --success:#4caf50;--danger:#e63946;--radius:12px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:40px}
header{text-align:center;padding:24px 16px 16px}
header h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),#a8dadc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}
header p{color:var(--text-dim);font-size:.85rem;margin-top:4px}

/* progress */
.progress-wrap{display:flex;justify-content:center;padding:0 16px 24px;max-width:700px;margin:0 auto}
.step-item{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.step-item:not(:last-child)::after{content:'';position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--surface2);transition:background .3s}
.step-item.done:not(:last-child)::after,.step-item.active:not(:last-child)::after{background:var(--accent)}
.step-dot{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;position:relative;z-index:1;transition:all .3s;color:var(--text-dim)}
.step-item.done .step-dot{background:var(--accent);color:#fff}
.step-item.active .step-dot{background:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent)}
.step-label{font-size:.6rem;margin-top:4px;color:var(--text-dim);white-space:nowrap}
.step-item.active .step-label{color:var(--accent)}

main{max-width:900px;margin:0 auto;padding:0 16px}
.screen{display:none}.screen.active{display:block}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;border:none;border-radius:var(--radius);font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;outline:none;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 15px rgba(0,180,216,.3)}
.btn-primary:hover{box-shadow:0 4px 20px rgba(0,180,216,.5)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-secondary{background:var(--surface2);color:var(--text)}
.btn-secondary:hover{background:#1a4a7a}
.btn-success{background:var(--success);color:#fff;box-shadow:0 4px 15px rgba(76,175,80,.3)}
.btn-sm{padding:6px 12px;font-size:.75rem;border-radius:8px}

/* error */
.error-box{text-align:center;padding:40px 20px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--danger)}
.error-box .icon{font-size:3rem;margin-bottom:16px}
.error-box h2{margin-bottom:8px}
.error-box p{color:var(--text-dim);line-height:1.6}

/* camera */
.camera-layout{display:flex;flex-direction:column;gap:20px}
@media(min-width:700px){.camera-layout{flex-direction:row;align-items:flex-start}.camera-col{flex:1;min-width:0}.thumbs-col{width:290px;flex-shrink:0}}
.video-wrap{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5);aspect-ratio:21/17;max-height:60vh}
@media(min-width:700px){.video-wrap{max-height:none}}
video{width:100%;height:100%;object-fit:cover;display:block}
.video-wrap.mirrored video{transform:scaleX(-1)}
.countdown-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:6rem;font-weight:900;color:#fff;text-shadow:0 0 40px rgba(0,0,0,.8);pointer-events:none;opacity:0;transition:opacity .2s}
.countdown-overlay.visible{opacity:1}
.flash-overlay{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0;transition:opacity .05s}
.flash-overlay.flash{opacity:1}
.shot-count{text-align:center;font-size:.9rem;color:var(--text-dim);margin-top:8px;min-height:1.5em}
.shot-count strong{color:var(--accent);font-size:1.1rem}
.camera-controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.camera-controls .btn{flex:1;min-width:100px}

/* thumbnails */
.thumbs-col h3{font-size:.85rem;color:var(--text-dim);margin-bottom:10px;text-align:center}
.thumb-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.thumb-item{background:var(--surface);border-radius:8px;overflow:hidden;border:2px solid transparent;transition:border-color .2s;position:relative}
.thumb-item.empty{aspect-ratio:21/17;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-dim);font-size:.75rem;gap:6px;border:2px dashed var(--surface2)}
.thumb-item.empty .num{font-size:1.2rem;font-weight:700;color:var(--surface2)}
.thumb-item img{width:100%;aspect-ratio:21/17;object-fit:cover;display:block}
.thumb-retake{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);white-space:nowrap;opacity:0;transition:opacity .2s}
.thumb-item:hover .thumb-retake{opacity:1}
@media(pointer:coarse){.thumb-retake{opacity:1}}

/* select */
.select-instruction{text-align:center;padding:12px 16px;background:var(--surface);border-radius:var(--radius);margin-bottom:16px}
.select-instruction p{margin-bottom:4px}
.select-count{color:var(--accent);font-weight:700;font-size:1.1rem}
.select-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
@media(min-width:600px){.select-grid{grid-template-columns:repeat(4,1fr)}}
.select-item{position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;border:3px solid transparent;transition:all .2s;user-select:none;-webkit-tap-highlight-color:transparent}
.select-item img{width:100%;aspect-ratio:21/17;object-fit:cover;display:block}
.select-item.selected{border-color:var(--accent);box-shadow:0 0 16px rgba(0,180,216,.4)}
.select-badge{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:.9rem;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.select-item.selected .select-badge{display:flex}
.select-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

/* ── decorate ─────────────────────────────── */
.deco-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}

.deco-options{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);padding:10px 14px;border-radius:var(--radius);width:100%;max-width:440px}
.toggle-label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.88rem;user-select:none}
.toggle-label input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:var(--accent)}
.date-input-field{flex:1;min-width:110px;background:var(--surface2);border:none;color:var(--text);padding:6px 10px;border-radius:8px;font-size:.85rem}
.date-input-field:focus{outline:1px solid var(--accent)}

.deco-preview-wrap{position:relative;width:100%;max-width:280px;border-radius:8px;transition:padding .2s,background .2s}
.deco-preview-wrap img{width:100%;display:block;border-radius:8px;pointer-events:none;user-select:none;-webkit-user-select:none}
.deco-preview-wrap.has-border{background:#fff;padding:8px 8px 30px;border-radius:4px}
.deco-preview-wrap.has-border img{border-radius:2px}
.border-date-text{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;color:#333;font-weight:700;pointer-events:none}
.sticker-layer{position:absolute;inset:0}

/* stickers */
.sticker{position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transform:translate(-50%,-50%);line-height:1;display:flex;align-items:center;justify-content:center}
.sticker:active{cursor:grabbing}
.sticker.selected::before{content:'';position:absolute;inset:-4px;border:1.5px dashed var(--accent);border-radius:4px;pointer-events:none}
.sticker-del{position:absolute;top:-11px;right:-11px;width:20px;height:20px;background:var(--danger);color:#fff;border:none;border-radius:50%;font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:20;line-height:1}
.sticker.selected .sticker-del{display:flex}

/* tabs */
.deco-tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:10px;width:100%;max-width:440px}
.tab-btn{flex:1;padding:8px;border:none;background:transparent;color:var(--text-dim);border-radius:8px;font-size:.88rem;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.tab-btn.active{background:var(--surface2);color:var(--accent);font-weight:600}
.tab-panel{display:none;width:100%;max-width:440px}
.tab-panel.active{display:block}

/* color swatches (공용) */
.color-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.color-row>span{font-size:.75rem;color:var(--text-dim)}
.color-swatches{display:flex;gap:5px;flex-wrap:wrap}
.color-swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s;flex-shrink:0}
.color-swatch.active{border-color:var(--accent);transform:scale(1.25)}

/* emoji sticker panel */
.emoji-panel{background:var(--surface);padding:10px;border-radius:var(--radius)}
.emoji-size-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.emoji-size-row>span{font-size:.75rem;color:var(--text-dim);white-space:nowrap}
.emoji-size-row input[type=range]{flex:1;accent-color:var(--accent)}
.emoji-size-val{font-size:.8rem;color:var(--text);min-width:28px;text-align:right}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:148px;overflow-y:auto}
.emoji-btn{border:none;background:transparent;font-size:1.45rem;cursor:pointer;padding:4px;border-radius:6px;transition:background .15s;line-height:1;-webkit-tap-highlight-color:transparent}
.emoji-btn:hover,.emoji-btn:active{background:var(--surface2)}

/* text panel */
.text-panel{background:var(--surface);padding:12px;border-radius:var(--radius);display:flex;flex-direction:column;gap:10px}
.text-input-row{display:flex;gap:8px}
.text-sticker-field{flex:1;background:var(--surface2);border:none;color:var(--text);padding:8px 12px;border-radius:8px;font-size:.95rem}
.text-sticker-field:focus{outline:1px solid var(--accent)}
.text-sticker-field::placeholder{color:var(--text-dim)}
.font-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.font-row>span{font-size:.75rem;color:var(--text-dim);white-space:nowrap}
.font-pills{display:flex;gap:5px;flex-wrap:wrap}
.font-pill{padding:4px 10px;border:1px solid var(--surface2);background:var(--surface2);color:var(--text);border-radius:6px;cursor:pointer;font-size:.8rem;transition:all .15s;-webkit-tap-highlight-color:transparent}
.font-pill.active{border-color:var(--accent);color:var(--accent)}
.size-row{display:flex;align-items:center;gap:10px}
.size-row>span{font-size:.75rem;color:var(--text-dim);white-space:nowrap}
.size-row input[type=range]{flex:1;accent-color:var(--accent)}
.size-val{font-size:.8rem;color:var(--text);min-width:28px;text-align:right}

.deco-clear{font-size:.75rem;color:var(--text-dim);cursor:pointer;text-decoration:underline}
.deco-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;max-width:440px}

/* result */
.result-wrap{display:flex;flex-direction:column;align-items:center;gap:20px}
.result-preview{max-width:300px;width:100%}
.result-preview img{width:100%;border-radius:var(--radius);box-shadow:0 8px 40px rgba(0,0,0,.6);display:block}
.result-info{text-align:center;color:var(--text-dim);font-size:.8rem}
.result-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

#compositeCanvas{display:none}
</style>
</head>
<body>

<header>
  <h1>인생투컷</h1>
  <p>4장 연속 촬영됩니다. 맘에 드는 2장을 골라요❤️</p>
</header>

<div class="progress-wrap" id="progressBar">
  <div class="step-item active" data-step="1"><div class="step-dot">1</div><span class="step-label">카메라</span></div>
  <div class="step-item" data-step="2"><div class="step-dot">2</div><span class="step-label">촬영</span></div>
  <div class="step-item" data-step="3"><div class="step-dot">3</div><span class="step-label">선택</span></div>
  <div class="step-item" data-step="4"><div class="step-dot">4</div><span class="step-label">꾸미기</span></div>
  <div class="step-item" data-step="5"><div class="step-dot">5</div><span class="step-label">저장</span></div>
</div>

<main>

  <div class="screen" id="screenError">
    <div class="error-box">
      <div class="icon">📵</div>
      <h2 id="errorTitle">오류 발생</h2>
      <p id="errorMsg"></p><br>
      <button class="btn btn-secondary" onclick="initCamera()">다시 시도</button>
    </div>
  </div>

  <div class="screen active" id="screenCamera">
    <div class="camera-layout">
      <div class="camera-col">
        <div class="video-wrap" id="videoWrap">
          <video id="video" autoplay playsinline muted></video>
          <div class="countdown-overlay" id="countdownOverlay"></div>
          <div class="flash-overlay" id="flashOverlay"></div>
        </div>
        <div class="shot-count" id="shotCount">카메라를 준비 중입니다…</div>
        <div class="camera-controls">
          <button class="btn btn-primary" id="btnShoot" onclick="startCountdown()" disabled>📷 촬영</button>
          <button class="btn btn-secondary btn-sm" onclick="toggleMirror()">🔁 반전</button>
          <button class="btn btn-secondary btn-sm" onclick="switchCamera()">🔄 전환</button>
        </div>
      </div>
      <div class="thumbs-col">
        <h3>촬영된 사진</h3>
        <div class="thumb-list" id="thumbList"></div>
      </div>
    </div>
  </div>

  <div class="screen" id="screenSelect">
    <div class="select-instruction">
      <p>원하는 사진 2장을 선택하세요</p>
      <div class="select-count" id="selectCountText">선택됨: 0 / 2</div>
    </div>
    <div class="select-grid" id="selectGrid"></div>
    <div class="select-actions">
      <button class="btn btn-secondary" onclick="goBackToCamera()">↩ 다시 촬영</button>
      <button class="btn btn-primary" id="btnCompose" onclick="composeAndDecorate()" disabled>✅ 두 장 고르기</button>
    </div>
  </div>

  <!-- STEP 4: 꾸미기 -->
  <div class="screen" id="screenDecorate">
    <div class="deco-wrap">

      <div class="deco-options">
        <label class="toggle-label">
          <input type="checkbox" id="toggleBorder" onchange="updateBorderPreview()">
          <span>🖼️ 흰 테두리 + 날짜</span>
        </label>
        <input type="text" id="dateInput" class="date-input-field" placeholder="2026.04.25">
      </div>

      <div class="deco-preview-wrap" id="decoPreviewWrap">
        <img id="decoBaseImg" src="" alt="합성 사진">
        <div class="sticker-layer" id="stickerLayer" onclick="onLayerClick(event)"></div>
        <div class="border-date-text" id="borderDateText" style="display:none"></div>
      </div>

      <div class="deco-tabs">
        <button class="tab-btn active" id="tabBtnEmoji" onclick="switchTab('emoji')">😊 이모지</button>
        <button class="tab-btn" id="tabBtnText" onclick="switchTab('text')">✏️ 텍스트</button>
      </div>

      <!-- 이모지 스티커 패널 -->
      <div class="tab-panel active" id="panelEmoji">
        <div class="emoji-panel">
          <div class="emoji-size-row">
            <span>크기</span>
            <input type="range" id="emojiSizeRange" min="20" max="72" value="36" oninput="document.getElementById('emojiSizeVal').textContent=this.value">
            <span class="emoji-size-val" id="emojiSizeVal">36</span>
          </div>
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>
      </div>

      <!-- 텍스트 패널 -->
      <div class="tab-panel" id="panelText">
        <div class="text-panel">
          <div class="text-input-row">
            <input type="text" id="textStickerInput" class="text-sticker-field" placeholder="텍스트를 입력하세요" maxlength="20">
            <button class="btn btn-primary btn-sm" onclick="addTextSticker()">추가</button>
          </div>
          <div class="font-row">
            <span>폰트</span>
            <div class="font-pills" id="fontPills"></div>
          </div>
          <div class="color-row">
            <span>색상</span>
            <div class="color-swatches" id="textColorSwatches"></div>
          </div>
          <div class="size-row">
            <span>크기</span>
            <input type="range" id="textSizeRange" min="16" max="60" value="28" oninput="document.getElementById('sizeVal').textContent=this.value">
            <span class="size-val" id="sizeVal">28</span>
          </div>
        </div>
      </div>

      <span class="deco-clear" onclick="clearAllStickers()">🗑️ 스티커 모두 지우기</span>

      <div class="deco-actions">
        <button class="btn btn-secondary" onclick="goBackToSelect()">↩ 다시 선택</button>
        <button class="btn btn-primary" onclick="finalizeDeco()">✅ 완성하기</button>
      </div>
    </div>
  </div>

  <!-- STEP 5: 저장 -->
  <div class="screen" id="screenResult">
    <div class="result-wrap">
      <div class="result-preview"><img id="resultImg" src="" alt="합성 결과"></div>
      <div class="result-info" id="resultInfo">630 × 1020 px | 300 DPI</div>
      <div class="result-actions">
        <button class="btn btn-success" onclick="download('png')">💾 PNG 저장</button>
        <button class="btn btn-success" onclick="download('jpg')">💾 JPG 저장</button>
        <button class="btn btn-secondary" onclick="resetAll()">🔄 새로 촬영하기</button>
      </div>
    </div>
  </div>

</main>

<canvas id="compositeCanvas" width="630" height="1020"></canvas>

<script>
// ── App Icon ──────────────────────────────────────────────
(function(){
  const ic=document.createElement('canvas');ic.width=180;ic.height=180;
  const c=ic.getContext('2d');const r=36;
  c.beginPath();c.moveTo(r,0);c.lineTo(180-r,0);c.quadraticCurveTo(180,0,180,r);
  c.lineTo(180,180-r);c.quadraticCurveTo(180,180,180-r,180);
  c.lineTo(r,180);c.quadraticCurveTo(0,180,0,180-r);c.lineTo(0,r);c.quadraticCurveTo(0,0,r,0);c.closePath();
  const g=c.createLinearGradient(0,0,180,180);g.addColorStop(0,'#00b4d8');g.addColorStop(1,'#0077b6');
  c.fillStyle=g;c.fill();c.fillStyle='#fff';c.font='bold 120px Arial,sans-serif';
  c.textAlign='center';c.textBaseline='middle';c.fillText('2',90,94);
  const url=ic.toDataURL('image/png');document.getElementById('appleIcon').href=url;
  const fav=document.createElement('link');fav.rel='icon';fav.type='image/png';fav.href=url;
  document.head.appendChild(fav);
})();

// ── Constants ─────────────────────────────────────────────
const CANVAS_W=630, CANVAS_H=1020, HALF_H=510, MAX_SHOTS=4;

const EMOJIS=[
  '❤️','🧡','💛','💚','💙','💜','🖤','🤍','🩷',
  '💕','💞','💗','💖','💝','💘','😊','😄','😍',
  '🥰','😘','🤩','😎','🤗','🫶','👑','💎','🪄',
  '🦄','✨','⭐','🌟','💫','🔥','⚡','🌈','🌙',
  '☁️','🌸','🌺','🌻','🌼','🌹','🍀','🦋','🌊',
  '🌴','🍃','🎀','🎁','🎉','🎊','🎈','🎶','🎵',
  '📷','📸','🥂','🍭','🍰','🧁','😂','😭','🥹',
];
const TEXT_COLORS=['#ffffff','#000000','#ff6b9d','#ffd166','#06d6a0','#00b4d8','#ef476f','#ff9f1c'];

const FONTS=[
  {name:'Black Han Sans', label:'블랙한'},
  {name:'Jua',            label:'주아체'},
  {name:'Gaegu',          label:'개구체'},
  {name:'Noto Sans KR',   label:'노토'},
  {name:'Pacifico',       label:'Pacifico'},
];

// ── State ─────────────────────────────────────────────────
let stream=null, currentFacing='user', mirrored=true;
let photos=Array(MAX_SHOTS).fill(null), retakeIndex=-1;
let selectedIdx=[], isCountingDown=false;
let baseCanvas=null, activeStickerEl=null;
let activeTextColor='#ffffff', activeFont='Black Han Sans';

// ── DOM ───────────────────────────────────────────────────
const video=document.getElementById('video');
const videoWrap=document.getElementById('videoWrap');
const countdownOverlay=document.getElementById('countdownOverlay');
const flashOverlay=document.getElementById('flashOverlay');
const btnShoot=document.getElementById('btnShoot');
const thumbList=document.getElementById('thumbList');
const shotCountEl=document.getElementById('shotCount');
const canvas=document.getElementById('compositeCanvas');
const ctx=canvas.getContext('2d');

// ── Init ──────────────────────────────────────────────────
buildEmojiPanel();
buildTextPanel();
renderThumbSlots();
initCamera();

// ── Camera ────────────────────────────────────────────────
async function initCamera(){
  showScreen('screenCamera');setStep(1);
  btnShoot.disabled=true;shotCountEl.textContent='카메라를 준비 중입니다…';
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  const c={video:{facingMode:{ideal:currentFacing},width:{ideal:1280},height:{ideal:960}},audio:false};
  try{stream=await navigator.mediaDevices.getUserMedia(c);}
  catch(e){
    if(currentFacing==='user'){
      try{currentFacing='environment';c.video.facingMode={ideal:'environment'};stream=await navigator.mediaDevices.getUserMedia(c);}
      catch(e2){showCamError(e2);return;}
    }else{showCamError(e);return;}
  }
  video.srcObject=stream;await video.play();
  updateMirror();btnShoot.disabled=false;updateShotCount();setStep(2);
}
function showCamError(err){
  let title='카메라 오류',msg='';
  if(err.name==='NotAllowedError'||err.name==='PermissionDeniedError'){title='카메라 권한 필요';msg='카메라 접근 권한이 필요합니다. 브라우저 주소창 옆 잠금 아이콘을 눌러 허용해 주세요.';}
  else if(err.name==='NotFoundError'||err.name==='DevicesNotFoundError'){title='카메라를 찾을 수 없습니다';msg='연결된 카메라 장치가 없습니다.';}
  else{msg=`오류: ${err.message||err.name}`;}
  document.getElementById('errorTitle').textContent=title;
  document.getElementById('errorMsg').textContent=msg;
  showScreen('screenError');
}
function toggleMirror(){mirrored=!mirrored;updateMirror();}
function updateMirror(){videoWrap.classList.toggle('mirrored',mirrored);}
async function switchCamera(){currentFacing=currentFacing==='user'?'environment':'user';mirrored=currentFacing==='user';await initCamera();}

// ── Shoot ─────────────────────────────────────────────────
function startCountdown(){
  if(isCountingDown)return;
  const isRetake=retakeIndex>=0;
  const slot=isRetake?retakeIndex:photos.indexOf(null);
  if(slot===-1)return;
  runCountdown(slot,!isRetake);
}
function runCountdown(slot,autoContinue){
  isCountingDown=true;btnShoot.disabled=true;
  let count=3;countdownOverlay.textContent=count;countdownOverlay.classList.add('visible');
  const tick=setInterval(()=>{
    count--;
    if(count<=0){clearInterval(tick);countdownOverlay.textContent='📷';setTimeout(()=>{countdownOverlay.classList.remove('visible');capturePhoto(slot,autoContinue);},400);}
    else countdownOverlay.textContent=count;
  },1000);
}
function capturePhoto(slotIndex,autoContinue){
  flashOverlay.classList.add('flash');setTimeout(()=>flashOverlay.classList.remove('flash'),150);
  const tc=document.createElement('canvas');
  tc.width=video.videoWidth||640;tc.height=video.videoHeight||480;
  const tCtx=tc.getContext('2d');
  if(mirrored){tCtx.translate(tc.width,0);tCtx.scale(-1,1);}
  tCtx.drawImage(video,0,0,tc.width,tc.height);
  photos[slotIndex]=tc.toDataURL('image/jpeg',0.92);
  retakeIndex=-1;isCountingDown=false;
  renderThumbSlots();updateShotCount();
  const filled=photos.filter(Boolean).length;
  if(filled===MAX_SHOTS)setTimeout(goToSelect,800);
  else if(autoContinue)setTimeout(()=>{const n=photos.indexOf(null);if(n!==-1)runCountdown(n,true);},600);
  else btnShoot.disabled=false;
}
function updateShotCount(){
  const f=photos.filter(Boolean).length;
  if(f===0)shotCountEl.innerHTML='첫 번째 사진을 촬영하세요';
  else if(f<MAX_SHOTS)shotCountEl.innerHTML=`<strong>${f}</strong> / ${MAX_SHOTS} 촬영 완료`;
  else shotCountEl.innerHTML=`<strong>${MAX_SHOTS}</strong> / ${MAX_SHOTS} 촬영 완료 ✅`;
}

// ── Thumbnails ────────────────────────────────────────────
function renderThumbSlots(){
  thumbList.innerHTML='';
  for(let i=0;i<MAX_SHOTS;i++){
    const item=document.createElement('div');
    item.className='thumb-item'+(photos[i]?'':' empty');
    if(photos[i]){
      const img=document.createElement('img');img.src=photos[i];img.alt=`사진 ${i+1}`;item.appendChild(img);
      const btn=document.createElement('button');btn.className='btn btn-danger btn-sm thumb-retake';btn.textContent='🔄 다시 찍기';
      btn.onclick=()=>triggerRetake(i);item.appendChild(btn);
    }else item.innerHTML=`<span class="num">${i+1}</span><span>대기 중</span>`;
    thumbList.appendChild(item);
  }
}
function triggerRetake(index){retakeIndex=index;photos[index]=null;renderThumbSlots();updateShotCount();shotCountEl.innerHTML=`<strong>${index+1}번</strong> 사진을 다시 촬영하세요`;}

// ── Select ────────────────────────────────────────────────
function goToSelect(){showScreen('screenSelect');setStep(3);selectedIdx=[];buildSelectGrid();updateSelectUI();}
function goBackToCamera(){showScreen('screenCamera');setStep(2);renderThumbSlots();updateShotCount();}
function buildSelectGrid(){
  const grid=document.getElementById('selectGrid');grid.innerHTML='';
  photos.forEach((url,i)=>{
    const item=document.createElement('div');item.className='select-item';item.dataset.index=i;
    const img=document.createElement('img');img.src=url;img.alt=`사진 ${i+1}`;item.appendChild(img);
    const badge=document.createElement('div');badge.className='select-badge';item.appendChild(badge);
    item.onclick=()=>toggleSelect(i);grid.appendChild(item);
  });
}
function toggleSelect(index){
  const pos=selectedIdx.indexOf(index);
  if(pos!==-1)selectedIdx.splice(pos,1);
  else{if(selectedIdx.length>=2)return;selectedIdx.push(index);}
  updateSelectUI();
}
function updateSelectUI(){
  document.querySelectorAll('.select-item').forEach((item,i)=>{
    const pos=selectedIdx.indexOf(i);const badge=item.querySelector('.select-badge');
    if(pos!==-1){item.classList.add('selected');badge.textContent=pos===0?'①':'②';}
    else{item.classList.remove('selected');badge.textContent='';}
  });
  document.getElementById('selectCountText').textContent=`선택됨: ${selectedIdx.length} / 2`;
  document.getElementById('btnCompose').disabled=selectedIdx.length!==2;
}

// ── Compose → Decorate ────────────────────────────────────
function composeAndDecorate(){
  if(selectedIdx.length!==2)return;
  const [i1,i2]=selectedIdx;
  const img1=new Image(),img2=new Image();let loaded=0;
  function onLoad(){
    if(++loaded<2)return;
    baseCanvas=document.createElement('canvas');baseCanvas.width=CANVAS_W;baseCanvas.height=CANVAS_H;
    const bx=baseCanvas.getContext('2d');
    bx.fillStyle='#ffffff';bx.fillRect(0,0,CANVAS_W,CANVAS_H);
    drawCover(bx,img1,0,0,CANVAS_W,HALF_H);
    bx.fillStyle='#ffffff';bx.fillRect(0,HALF_H-1,CANVAS_W,2);
    drawCover(bx,img2,0,HALF_H,CANVAS_W,HALF_H);
    document.getElementById('decoBaseImg').src=baseCanvas.toDataURL('image/jpeg',0.95);
    initDecorateScreen();showScreen('screenDecorate');setStep(4);
  }
  img1.onload=onLoad;img2.onload=onLoad;img1.src=photos[i1];img2.src=photos[i2];
}
function drawCover(c,img,x,y,w,h){
  const ia=img.naturalWidth/img.naturalHeight,ba=w/h;
  let sx,sy,sw,sh;
  if(ia>ba){sh=img.naturalHeight;sw=sh*ba;sx=(img.naturalWidth-sw)/2;sy=0;}
  else{sw=img.naturalWidth;sh=sw/ba;sx=0;sy=(img.naturalHeight-sh)/2;}
  c.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}

// ── Decorate init ─────────────────────────────────────────
function initDecorateScreen(){
  document.getElementById('stickerLayer').innerHTML='';activeStickerEl=null;
  const d=new Date();
  document.getElementById('dateInput').value=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('toggleBorder').checked=false;
  document.getElementById('decoPreviewWrap').classList.remove('has-border');
  document.getElementById('borderDateText').style.display='none';
}
function updateBorderPreview(){
  const on=document.getElementById('toggleBorder').checked;
  document.getElementById('decoPreviewWrap').classList.toggle('has-border',on);
  const dt=document.getElementById('borderDateText');
  if(on){dt.style.display='block';dt.textContent=document.getElementById('dateInput').value;document.getElementById('dateInput').oninput=()=>{dt.textContent=document.getElementById('dateInput').value;};}
  else{dt.style.display='none';document.getElementById('dateInput').oninput=null;}
}
function goBackToSelect(){document.getElementById('stickerLayer').innerHTML='';activeStickerEl=null;showScreen('screenSelect');setStep(3);}

// ── Emoji Panel ───────────────────────────────────────────
function buildEmojiPanel(){
  const grid=document.getElementById('emojiGrid');
  EMOJIS.forEach(em=>{
    const btn=document.createElement('button');btn.className='emoji-btn';btn.textContent=em;
    btn.onclick=()=>addEmojiSticker(em);grid.appendChild(btn);
  });
}

// ── Text Panel ────────────────────────────────────────────
function buildTextPanel(){
  // font pills
  const pillWrap=document.getElementById('fontPills');
  FONTS.forEach((f,i)=>{
    const btn=document.createElement('button');btn.className='font-pill'+(i===0?' active':'');
    btn.textContent=f.label;btn.style.fontFamily=`'${f.name}',sans-serif`;btn.dataset.font=f.name;
    btn.onclick=()=>{
      document.querySelectorAll('.font-pill').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');activeFont=f.name;
    };
    pillWrap.appendChild(btn);
  });
  // text color swatches
  const tcWrap=document.getElementById('textColorSwatches');
  TEXT_COLORS.forEach((hex,i)=>{
    const sw=document.createElement('div');sw.className='color-swatch'+(i===0?' active':'');
    sw.style.background=hex;sw.dataset.hex=hex;
    if(hex==='#ffffff')sw.style.border='2px solid #555';
    sw.onclick=()=>{
      document.querySelectorAll('#textColorSwatches .color-swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');activeTextColor=hex;
    };
    tcWrap.appendChild(sw);
  });
}

// ── Sticker factory ───────────────────────────────────────
function addEmojiSticker(em){
  const size=parseInt(document.getElementById('emojiSizeRange').value);
  const imgEl=document.getElementById('decoBaseImg');
  const el=document.createElement('div');
  el.className='sticker';el.dataset.type='emoji';el.dataset.content=em;el.dataset.size=size;
  el.style.fontSize=size+'px';el.textContent=em;
  el.style.left=(imgEl.offsetWidth/2)+'px';el.style.top=(imgEl.offsetHeight/2)+'px';
  attachDelBtn(el);makeDraggable(el);
  document.getElementById('stickerLayer').appendChild(el);selectSticker(el);
}
function addTextSticker(){
  const val=document.getElementById('textStickerInput').value.trim();if(!val)return;
  const size=parseInt(document.getElementById('textSizeRange').value);
  const imgEl=document.getElementById('decoBaseImg');
  const el=document.createElement('div');
  el.className='sticker';el.dataset.type='text';el.dataset.content=val;
  el.dataset.color=activeTextColor;el.dataset.font=activeFont;el.dataset.size=size;
  el.style.cssText+=`font-size:${size}px;color:${activeTextColor};font-family:'${activeFont}',sans-serif;font-weight:700;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,0.7);`;
  el.textContent=val;
  el.style.left=(imgEl.offsetWidth/2)+'px';el.style.top=(imgEl.offsetHeight/2)+'px';
  attachDelBtn(el);makeDraggable(el);
  document.getElementById('stickerLayer').appendChild(el);selectSticker(el);
  document.getElementById('textStickerInput').value='';
}
function attachDelBtn(el){
  const del=document.createElement('button');del.className='sticker-del';del.textContent='✕';
  del.onpointerdown=e=>{e.stopPropagation();el.remove();if(activeStickerEl===el)activeStickerEl=null;};
  el.appendChild(del);
}

// ── Drag ─────────────────────────────────────────────────
function makeDraggable(el){
  let sx,sy,ox,oy;
  el.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('sticker-del'))return;
    e.preventDefault();e.stopPropagation();el.setPointerCapture(e.pointerId);
    selectSticker(el);sx=e.clientX;sy=e.clientY;
    ox=parseFloat(el.style.left);oy=parseFloat(el.style.top);
  });
  el.addEventListener('pointermove',e=>{
    if(!(e.buttons&1))return;
    el.style.left=(ox+e.clientX-sx)+'px';el.style.top=(oy+e.clientY-sy)+'px';
  });
}
function selectSticker(el){if(activeStickerEl)activeStickerEl.classList.remove('selected');activeStickerEl=el;el.classList.add('selected');}
function onLayerClick(e){if(e.target===document.getElementById('stickerLayer')){if(activeStickerEl){activeStickerEl.classList.remove('selected');activeStickerEl=null;}}}
function clearAllStickers(){document.getElementById('stickerLayer').innerHTML='';activeStickerEl=null;}
function switchTab(tab){
  document.getElementById('panelEmoji').classList.toggle('active',tab==='emoji');
  document.getElementById('panelText').classList.toggle('active',tab==='text');
  document.getElementById('tabBtnEmoji').classList.toggle('active',tab==='emoji');
  document.getElementById('tabBtnText').classList.toggle('active',tab==='text');
}

// ── Finalize ─────────────────────────────────────────────
async function finalizeDeco(){
  if(!baseCanvas)return;
  // pre-load fonts used in text stickers
  const usedFonts=new Set();
  document.querySelectorAll('.sticker[data-type="text"]').forEach(el=>usedFonts.add(el.dataset.font));
  try{await Promise.all([...usedFonts].map(f=>document.fonts.load(`bold 30px '${f}'`)));}catch(e){}

  const hasBorder=document.getElementById('toggleBorder').checked;
  const dateText=document.getElementById('dateInput').value.trim();
  const B=hasBorder?25:0, DH=hasBorder?60:0, BT=hasBorder?20:0;
  const finalW=CANVAS_W+B*2, finalH=CANVAS_H+BT+DH;
  canvas.width=finalW;canvas.height=finalH;
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,finalW,finalH);
  ctx.drawImage(baseCanvas,B,BT,CANVAS_W,CANVAS_H);
  if(hasBorder&&dateText){
    ctx.fillStyle='#333';ctx.font='bold 22px -apple-system,Arial,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(dateText,finalW/2,CANVAS_H+BT+DH/2);
  }

  // collect stickers
  const layer=document.getElementById('stickerLayer');
  const imgEl=document.getElementById('decoBaseImg');
  const scaleX=CANVAS_W/imgEl.offsetWidth, scaleY=CANVAS_H/imgEl.offsetHeight;

  layer.querySelectorAll('.sticker').forEach(el=>{
    const cx=parseFloat(el.style.left)*scaleX+B;
    const cy=parseFloat(el.style.top)*scaleY+BT;
    const dSz=parseFloat(el.dataset.size);
    const cSz=dSz*Math.min(scaleX,scaleY);
    ctx.save();
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(el.dataset.type==='emoji'){
      ctx.font=`${cSz}px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",serif`;
      ctx.fillText(el.dataset.content,cx,cy);
    }else{
      ctx.font=`bold ${cSz}px '${el.dataset.font}',sans-serif`;
      ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=cSz/6;
      ctx.fillStyle=el.dataset.color;
      ctx.fillText(el.dataset.content,cx,cy);
    }
    ctx.restore();
  });

  document.getElementById('resultImg').src=canvas.toDataURL('image/png');
  document.getElementById('resultInfo').textContent=`${finalW} × ${finalH} px${hasBorder?' (테두리 포함)':''} | 300 DPI`;
  showScreen('screenResult');setStep(5);
}

// ── Download ──────────────────────────────────────────────
function download(format){
  const dataUrl=format==='png'?canvas.toDataURL('image/png'):canvas.toDataURL('image/jpeg',0.95);
  const filename=format==='png'?'photo_id.png':'photo_id.jpg';
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  if(isIOS){
    const w=window.open('','_blank');
    w.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>사진 저장</title><style>body{margin:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,sans-serif;color:#e0e0e0;padding:20px}img{max-width:100%;max-height:70vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.6);display:block}.guide{margin-top:20px;background:#0f3460;border-radius:12px;padding:16px 20px;text-align:center;line-height:1.9}.guide strong{color:#00b4d8}.btn-reset{margin-top:20px;padding:14px 32px;background:#0f3460;color:#e0e0e0;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer}</style></head><body><img src="${dataUrl}"><div class="guide">이미지를 <strong>길게 누르기</strong><br>→ <strong>"사진에 추가"</strong> 선택<br><span style="color:#8888aa;font-size:.85rem">사진 앱 카메라 롤에 저장됩니다</span></div><button class="btn-reset" onclick="window.opener&&window.opener.resetAll();window.close();">🔄 새로 촬영하기</button></body></html>`);
    w.document.close();return;
  }
  const a=document.createElement('a');a.href=dataUrl;a.download=filename;a.click();
}

// ── Reset ─────────────────────────────────────────────────
function resetAll(){
  photos=Array(MAX_SHOTS).fill(null);selectedIdx=[];retakeIndex=-1;
  baseCanvas=null;isCountingDown=false;btnShoot.disabled=false;activeStickerEl=null;
  document.getElementById('stickerLayer').innerHTML='';
  renderThumbSlots();updateShotCount();showScreen('screenCamera');setStep(2);
}

// ── Helpers ───────────────────────────────────────────────
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function setStep(n){document.querySelectorAll('#progressBar .step-item').forEach(el=>{const s=parseInt(el.dataset.step);el.classList.remove('active','done');if(s<n)el.classList.add('done');else if(s===n)el.classList.add('active');});}
</script>
